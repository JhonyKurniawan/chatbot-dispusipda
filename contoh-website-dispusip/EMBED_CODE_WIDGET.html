================================================================================
EMBED CODE CHATBOT DISPUSIPDA
================================================================================
Copy-paste seluruh kode di bawah ini ke website Dispusipda
Letakkan sebelum tag </body>

PENTING: Ganti RAILWAY_API_URL dengan URL Railway Anda yang sebenarnya!
================================================================================
-->

<script>
(function() {
    // =====================================================
    // KONFIGURASI - GANTI URL INI SETELAH DEPLOY KE RAILWAY
    // =====================================================
    const RAILWAY_API_URL = 'https://chatbot-dispusipda-production.up.railway.app';
    // =====================================================
    
    // Inject CSS
    const style = document.createElement('style');
    style.textContent = `
        #chatbot-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #chatbot-toggle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        #chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.5);
        }
        
        #chatbot-toggle svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
        
        #chatbot-window {
            display: none;
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            flex-direction: column;
            animation: slideUp 0.3s ease;
        }
        
        #chatbot-window.open {
            display: flex;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-header img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            padding: 5px;
        }
        
        .chat-header-info h4 {
            margin: 0;
            font-size: 1.1rem;
        }
        
        .chat-header-info p {
            margin: 3px 0 0;
            font-size: 0.8rem;
            opacity: 0.9;
        }
        
        .chat-close {
            margin-left: auto;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        
        .chat-close:hover {
            opacity: 1;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .chat-input-area input:focus {
            border-color: #667eea;
        }
        
        .chat-input-area button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .chat-input-area button:hover {
            transform: scale(1.05);
        }
        
        .chat-input-area button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite both;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .feedback-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .feedback-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .feedback-btn:hover {
            background: #f0f0f0;
        }
        
        .feedback-btn.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        @media (max-width: 480px) {
            #chatbot-window {
                width: calc(100% - 20px);
                right: 10px;
                bottom: 80px;
                height: 70vh;
            }
        }
    `;
    document.head.appendChild(style);
    
    // Create widget HTML
    const widgetHTML = `
        <div id="chatbot-widget-container">
            <div id="chatbot-window">
                <div class="chat-header">
                    <img src="https://dispusipda.pekanbaru.go.id/wp-content/uploads/2022/08/logopkb-1.png" alt="Dispusipda">
                    <div class="chat-header-info">
                        <h4>Dispusipda Assistant</h4>
                        <p>🟢 Online - Siap membantu!</p>
                    </div>
                    <button class="chat-close" onclick="toggleChat()">&times;</button>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <div class="message bot">
                        <div class="message-content">
                            Halo! 👋 Saya asisten virtual Dispusipda Pekanbaru. Ada yang bisa saya bantu?
                            <br><br>
                            Anda bisa bertanya tentang:
                            <br>• Jam operasional
                            <br>• Cara daftar member
                            <br>• Koleksi buku/e-book
                            <br>• Layanan kearsipan
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Ketik pertanyaan Anda..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()">
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
            <button id="chatbot-toggle" onclick="toggleChat()">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
            </button>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', widgetHTML);
    
    let sessionId = localStorage.getItem('chatbot_session_id');
    if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatbot_session_id', sessionId);
    }
    
    let currentFaqId = null;
    
    window.toggleChat = function() {
        const chatWindow = document.getElementById('chatbot-window');
        chatWindow.classList.toggle('open');
    };
    
    window.handleKeyPress = function(e) {
        if (e.key === 'Enter') sendMessage();
    };
    
    window.sendMessage = async function() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (!message) return;
        
        addMessage(message, 'user');
        input.value = '';
        
        showTyping();
        
        try {
            const response = await fetch(RAILWAY_API_URL + '/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message, session_id: sessionId })
            });
            
            const data = await response.json();
            hideTyping();
            
            if (data.success) {
                currentFaqId = data.faq_id;
                addMessage(data.response, 'bot', true);
            } else {
                addMessage('Maaf, terjadi kesalahan. Silakan coba lagi.', 'bot');
            }
        } catch (error) {
            hideTyping();
            addMessage('Maaf, tidak dapat terhubung ke server. Pastikan koneksi internet Anda stabil.', 'bot');
        }
    };
    
    function addMessage(text, sender, showFeedback = false) {
        const container = document.getElementById('chat-messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + sender;
        
        let feedbackHTML = '';
        if (showFeedback && currentFaqId) {
            feedbackHTML = `
                <div class="feedback-buttons" data-faq-id="${currentFaqId}">
                    <span style="font-size: 0.8rem; color: #888;">Apakah membantu?</span>
                    <button class="feedback-btn" onclick="sendFeedback(${currentFaqId}, true, this)">👍</button>
                    <button class="feedback-btn" onclick="sendFeedback(${currentFaqId}, false, this)">👎</button>
                </div>
            `;
        }
        
        messageDiv.innerHTML = '<div class="message-content">' + text.replace(/\n/g, '<br>') + feedbackHTML + '</div>';
        container.appendChild(messageDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    window.sendFeedback = async function(faqId, isHelpful, btn) {
        const feedbackDiv = btn.parentElement;
        feedbackDiv.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        
        try {
            await fetch(RAILWAY_API_URL + '/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ faq_id: faqId, is_helpful: isHelpful, session_id: sessionId })
            });
            feedbackDiv.innerHTML = '<span style="color: #667eea; font-size: 0.85rem;">✓ Terima kasih atas feedback Anda!</span>';
        } catch (error) {
            console.error('Feedback error:', error);
        }
    };
    
    function showTyping() {
        const container = document.getElementById('chat-messages');
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typing-indicator';
        typingDiv.className = 'message bot';
        typingDiv.innerHTML = '<div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
        container.appendChild(typingDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    function hideTyping() {
        const typing = document.getElementById('typing-indicator');
        if (typing) typing.remove();
    }
})();
</script>
